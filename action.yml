name: Update Modrinth Dependencies
description: Check for dependency updates on Modrinth and open PRs

inputs:
  config:
    description: Path to the JSON config file mapping gradle.properties keys to Modrinth slugs
    default: modrinth_deps.json
  gradle-properties:
    description: Path to gradle.properties
    default: gradle.properties
  token:
    description: >
      GitHub token for creating PRs. The default GITHUB_TOKEN will NOT trigger
      CI on created PRs (GitHub prevents recursive workflows). Pass a PAT or
      GitHub App token to ensure CI runs on the PRs.
    default: ${{ github.token }}

runs:
  using: composite
  steps:

  - name: Set up uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true
      working-directory: ${{ github.action_path }}

  - name: Configure git credentials
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.token }}
    run: |
      # Remove the default GITHUB_TOKEN credentials set by actions/checkout
      # and use gh CLI as the credential helper instead, so git operations
      # use the provided token (which may be a PAT for triggering CI on PRs)
      git config --local --unset-all http.https://github.com/.extraheader || true
      gh auth setup-git

  - name: Run main.py
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.token }}
    run: |
      uv run --locked --project "${{ github.action_path }}" \
        "${{ github.action_path }}/main.py" \
        --config "${{ inputs.config }}" \
        --gradle-properties "${{ inputs.gradle-properties }}"
