name: Update Modrinth Dependencies
description: Check for dependency updates on Modrinth and open PRs

inputs:
  config:
    description: Path to the JSON config file mapping gradle.properties keys to Modrinth slugs
    default: modrinth_deps.json
  gradle-properties:
    description: Path to gradle.properties
    default: gradle.properties
  ref:
    description: >
      Optional branch/ref to check out before running. If set, this action
      runs actions/checkout itself using the provided token. If omitted, the
      repository is assumed to have been checked out already by an earlier step.
    default: ""
  token:
    description: >
      GitHub token for creating PRs. The default GITHUB_TOKEN will NOT trigger
      CI on created PRs (GitHub prevents recursive workflows). Pass a PAT or
      GitHub App token to ensure CI runs on the PRs.
    default: ${{ github.token }}

runs:
  using: composite
  steps:

  - name: Checkout repository
    if: ${{ inputs.ref != '' }}
    uses: actions/checkout@v6
    with:
      ref: ${{ inputs.ref }}
      token: ${{ inputs.token }}
      persist-credentials: true

  - name: Set up uv
    uses: astral-sh/setup-uv@v7
    with:
      enable-cache: true
      working-directory: ${{ github.action_path }}

  - name: Run main.py
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.token }}
    run: |
      uv run --locked --project "${{ github.action_path }}" \
        "${{ github.action_path }}/main.py" \
        --config "${{ inputs.config }}" \
        --gradle-properties "${{ inputs.gradle-properties }}"
